<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Calculadora por Voz</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #eeeeee;
    padding-top: 40px;
}

h1 {
    font-size: 32px;
}

button {
    font-size: 25px;
    padding: 15px 30px;
    border: none;
    border-radius: 10px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #444;
}

#texto {
    font-size: 24px;
    margin-top: 30px;
}

#resultado {
    font-size: 50px;
    font-weight: bold;
    margin-top: 20px;
}

#estado {
    font-size: 18px;
    margin-top: 20px;
}

</style>

</head>


<body>

<h1>🎤 Calculadora por Voz</h1>

<button id="boton">
🎤 HABLAR
</button>

<div id="texto">
Pulsa el botón y habla
</div>

<div id="resultado">
-
</div>

<div id="estado">
📡 ESP32: conectado
</div>


<script>


// ==================================================
// IP DEL ESP32
// ==================================================

const IP_ESP32 = "192.168.1.30";


// ==================================================
// ELEMENTOS
// ==================================================

const boton =
document.getElementById("boton");

const textoPantalla =
document.getElementById("texto");

const resultadoPantalla =
document.getElementById("resultado");

const estado =
document.getElementById("estado");


// ==================================================
// RECONOCIMIENTO DE VOZ
// ==================================================

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    textoPantalla.innerText =
    "❌ Este navegador no soporta reconocimiento de voz.";

} else {


    const reconocimiento =
    new SpeechRecognition();


    reconocimiento.lang =
    "es-CO";


    reconocimiento.continuous =
    false;


    reconocimiento.interimResults =
    false;


    // ==================================================
    // BOTON
    // ==================================================

    boton.onclick = function() {

        textoPantalla.innerText =
        "🎤 ESCUCHANDO...";

        resultadoPantalla.innerText =
        "...";

        estado.innerText =
        "🎤 Escuchando...";


        try {

            reconocimiento.start();

        } catch(error) {

            console.log(error);

        }

    };


    // ==================================================
    // VOZ RECONOCIDA
    // ==================================================

    reconocimiento.onresult =
    function(event) {


        const texto =
        event.results[0][0].transcript;


        console.log(
        "================================"
        );


        console.log(
        "VOZ RECONOCIDA:"
        );


        console.log(texto);


        console.log(
        "================================"
        );


        textoPantalla.innerText =
        "Escuché: " + texto;


        calcular(texto);

    };


    // ==================================================
    // ERROR
    // ==================================================

    reconocimiento.onerror =
    function(event) {

        console.log(
        "ERROR:",
        event.error
        );


        textoPantalla.innerText =
        "Error: " + event.error;


        resultadoPantalla.innerText =
        "❌";


        estado.innerText =
        "❌ Error de reconocimiento";

    };

}


// ==================================================
// CALCULADORA
// ==================================================

function calcular(texto) {


    // ==================================================
    // NORMALIZAR
    // ==================================================

    texto =
    texto.toLowerCase().trim();


    const normalizado =
    texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");


    console.log(
    "TEXTO NORMALIZADO:"
    );


    console.log(
    normalizado
    );



    // ==================================================
    // DETECTAR OPERACION
    // ==================================================

    let operacion = null;


    // ==================================================
    // DIVISION
    // ==================================================

    if (
        /divid|entre|division|repart/.test(normalizado) ||
        normalizado.includes("/")
    ) {

        operacion = "/";

        console.log(
        ">>> DIVISION DETECTADA <<<"
        );

    }


    // ==================================================
    // SUMA
    // ==================================================

    else if (
        /mas|suma|sumar/.test(normalizado) ||
        normalizado.includes("+")
    ) {

        operacion = "+";

        console.log(
        ">>> SUMA DETECTADA <<<"
        );

    }


    // ==================================================
    // RESTA
    // ==================================================

    else if (
        /menos|resta|restar/.test(normalizado) ||
        normalizado.includes("-")
    ) {

        operacion = "-";

        console.log(
        ">>> RESTA DETECTADA <<<"
        );

    }


    // ==================================================
    // MULTIPLICACION
    // ==================================================

    else if (
        /por|multiplic/.test(normalizado) ||
        normalizado.includes("*")
    ) {

        operacion = "*";

        console.log(
        ">>> MULTIPLICACION DETECTADA <<<"
        );

    }


    console.log(
    "OPERACION FINAL:",
    operacion
    );



    // ==================================================
    // NUMEROS
    // ==================================================

    const numeros = {

        "cero": 0,

        "uno": 1,
        "una": 1,

        "dos": 2,

        "tres": 3,

        "cuatro": 4,

        "cinco": 5,

        "seis": 6,

        "siete": 7,

        "ocho": 8,

        "nueve": 9,

        "diez": 10,

        "once": 11,

        "doce": 12,

        "trece": 13,

        "catorce": 14,

        "quince": 15,

        "dieciseis": 16,

        "diecisiete": 17,

        "dieciocho": 18,

        "diecinueve": 19,

        "veinte": 20,

        "treinta": 30,

        "cuarenta": 40,

        "cincuenta": 50,

        "sesenta": 60,

        "setenta": 70,

        "ochenta": 80,

        "noventa": 90,

        "cien": 100,

        "ciento": 100

    };


    let encontrados = [];


    // ==================================================
    // BUSCAR NUMEROS ESCRITOS
    // ==================================================

    for (
        const palabra in numeros
    ) {

        const regex =
        new RegExp(
            "\\b" +
            palabra +
            "\\b",
            "gi"
        );


        const coincidencias =
        normalizado.match(regex);


        if (coincidencias) {

            for (
                let i = 0;
                i < coincidencias.length;
                i++
            ) {

                encontrados.push(
                numeros[palabra]
                );

            }

        }

    }


    // ==================================================
    // BUSCAR NUMEROS DIGITALES
    // ==================================================

    const digitales =
    normalizado.match(
        /\d+(?:[.,]\d+)?/g
    );


    if (digitales) {

        digitales.forEach(
        numero => {

            encontrados.push(
                Number(
                    numero.replace(",", ".")
                )
            );

        });

    }


    console.log(
    "NUMEROS:",
    encontrados
    );



    // ==================================================
    // NO HAY NUMEROS
    // ==================================================

    if (
        encontrados.length === 0
    ) {

        resultadoPantalla.innerText =
        "❌ No entendí";

        estado.innerText =
        "❌ No encontré números";

        return;

    }



    // ==================================================
    // FALTA OPERACION
    // ==================================================

    if (
        operacion === null
    ) {

        resultadoPantalla.innerText =
        "❌ Falta operación";

        estado.innerText =
        "❌ No detecté la operación";

        console.log(
        "!!! NO SE DETECTO OPERACION !!!"
        );

        return;

    }



    // ==================================================
    // CALCULAR
    // ==================================================

    let resultado =
    encontrados[0];


    for (
        let i = 1;
        i < encontrados.length;
        i++
    ) {


        const numero =
        encontrados[i];


        // ==============================================
        // SUMA
        // ==============================================

        if (
            operacion === "+"
        ) {

            resultado += numero;

        }


        // ==============================================
        // RESTA
        // ==============================================

        else if (
            operacion === "-"
        ) {

            resultado -= numero;

        }


        // ==============================================
        // MULTIPLICACION
        // ==============================================

        else if (
            operacion === "*"
        ) {

            resultado *= numero;

        }


        // ==============================================
        // DIVISION
        // ==============================================

        else if (
            operacion === "/"
        ) {


            if (
                numero === 0
            ) {

                resultadoPantalla.innerText =
                "❌ No se puede ÷ 0";

                estado.innerText =
                "❌ División entre cero";

                return;

            }


            resultado /=
            numero;

        }

    }



    // ==================================================
    // MOSTRAR RESULTADO
    // ==================================================

    resultadoPantalla.innerText =
    "= " + resultado;


    estado.innerText =
    "📡 Enviando al ESP32...";


    console.log(
    "RESULTADO:",
    resultado
    );



    // ==================================================
    // ENVIAR AL ESP32
    // ==================================================

    enviarAlESP32(
        texto,
        resultado
    );

}



// ==================================================
// ENVIAR AL ESP32
// ==================================================

function enviarAlESP32(
operacion,
resultado
) {


    const url =
    "http://" +
    IP_ESP32 +
    "/calcular?operacion=" +
    encodeURIComponent(operacion) +
    "&resultado=" +
    encodeURIComponent(resultado);


    console.log(
    "URL ENVIADA:"
    );


    console.log(
    url
    );


    fetch(url)

    .then(
    response => {

        if (!response.ok) {

            throw new Error(
            "ESP32 respondió con error"
            );

        }

        return response.text();

    })

    .then(
    data => {

        console.log(
        "RESPUESTA ESP32:",
        data
        );


        estado.innerText =
        "✅ ESP32 actualizado";

    })

    .catch(
    error => {

        console.error(
        error
        );


        estado.innerText =
        "❌ No se pudo conectar al ESP32";

    });

}


</script>

</body>

</html>
